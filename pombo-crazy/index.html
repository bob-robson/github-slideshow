<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Pombo Crazy</title>
<meta name="description" content="Animação com rock e palmas: o Pombo Crazy, fiscal do banheiro, encara a criançada até todo mundo lavar as mãos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1a18;
    --ink: #fffbe6;
    --accent: #f9c80e;
    --head: #f4eba4;
    --panel: rgba(20, 18, 14, 0.78);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1b1a18; }
  }
  :root[data-theme="dark"] { --bg: #1b1a18; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px;
  }
  .stage {
    position: relative;
    width: min(100%, calc((100vh - 32px) * 16 / 9));
    aspect-ratio: 16 / 9;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    container-type: inline-size;
    background: #4a4640;
  }
  svg#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .lyrics {
    position: absolute; left: 50%; bottom: 2.2cqw; transform: translateX(-50%);
    max-width: 92%;
    background: var(--panel);
    padding: .4cqw 2cqw;
    border-radius: 2cqw;
    font-size: 3cqw; font-weight: 800; line-height: 1.25;
    text-align: center; white-space: nowrap;
    opacity: 0; transition: opacity .3s;
    pointer-events: none;
  }
  .lyrics.on { opacity: 1; }
  .lyrics .wrap { position: relative; display: inline-block; }
  .lyrics .base { color: rgba(255,255,255,.55); }
  .lyrics .fill {
    position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap;
    color: var(--accent); width: 0%;
  }
  .lyrics .note { color: var(--accent); margin-right: .6cqw; display: inline-block; }
  .lyrics .note.right { margin: 0 0 0 .6cqw; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.4cqw; text-align: center;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.25), rgba(0,0,0,.72));
    transition: opacity .6s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title {
    font-size: 9cqw; font-weight: 800; line-height: .95; margin: 0;
    color: var(--head);
    text-shadow: .5cqw .5cqw 0 #000, 0 0 3cqw rgba(249,200,14,.5);
    transform: rotate(-3deg);
  }
  .title span { color: var(--accent); }
  .subtitle { font-size: 2.4cqw; font-weight: 600; margin: 0; max-width: 70%; }
  button {
    font: inherit; font-weight: 800; font-size: 2.6cqw;
    padding: .8cqw 3cqw; border-radius: 99px; border: .35cqw solid #000;
    background: var(--accent); color: #000; cursor: pointer;
    box-shadow: 0 .5cqw 0 #000;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(.4cqw); box-shadow: 0 .1cqw 0 #000; }
  .row { display: flex; gap: 1.5cqw; flex-wrap: wrap; justify-content: center; }
  .ghost { background: transparent; color: var(--ink); border-color: var(--ink); box-shadow: none; font-size: 1.8cqw; }
  .titleCard {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0;
  }
  .soundBtn {
    position: absolute; top: 1.2cqw; right: 1.2cqw; font-size: 1.6cqw; padding: .3cqw 1.2cqw;
    box-shadow: none; border-width: .2cqw; display: none;
  }
</style>
</head>
<body>

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (k) => k * k * (3 - 2 * k);
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const between = (t, a, b) => t >= a && t < b;
  const fade = (t, a, b, f = 0.3) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));

  const BEAT = 0.5;          // 120 BPM
  const LINE = 4;            // 2 bars per lyric line
  const DURATION = 76;

  // ---------------------------------------------------------------- song
  // Rock com palmas, no estilo "lava uma mão, lava outra".
  // Each line: [lyric, melody pattern, chord bar 1, chord bar 2, section]
  const P = {
    va: [[0,.5,'E4'],[.5,.5,'E4'],[1,.5,'G4'],[1.5,.5,'G4'],[2,.5,'A4'],[2.5,.5,'G4'],[3,1,'E4'],[4,.5,'D4'],[4.5,.5,'E4'],[5,.5,'F4'],[5.5,.5,'E4'],[6,2,'D4']],
    vb: [[0,.5,'C4'],[.5,.5,'E4'],[1,.5,'A4'],[1.5,.5,'A4'],[2,.5,'G4'],[2.5,.5,'E4'],[3,1,'C4'],[4,.5,'F4'],[4.5,.5,'F4'],[5,.5,'A4'],[5.5,.5,'G4'],[6,2,'F4']],

    // Pal-ma com pal-ma, ba-te, ba-te — la-var é EA-sy!
    c2: [[0,.5,'A4'],[.5,.5,'A4'],[1,.5,'C5'],[1.5,.5,'A4'],[2,.5,'E4'],[2.5,.5,'G4'],[3,.5,'E4'],[3.5,.5,'G4'],[4.5,.5,'F4'],[5,.5,'A4'],[5.5,.5,'C5'],[6,1,'C5'],[7,1,'A4']],
    // E-le tá de o-lho, não pis-ca não — Pom-bo CRA-zy!
    c4: [[0,.25,'F4'],[.25,.25,'F4'],[.5,.5,'A4'],[1,.5,'C5'],[1.5,.5,'C5'],[2,.5,'D5'],[2.5,.5,'C5'],[3,.5,'A4'],[3.5,.5,'C5'],[4,.5,'B4'],[4.5,.5,'G4'],[5.5,.5,'G4'],[6,.5,'A4'],[6.5,.5,'B4'],[7,1,'D5']],
    end: [[0,.5,'F4'],[.5,.5,'A4'],[1,.5,'C5'],[1.5,.5,'D5'],[2,1,'C5'],[3,1,'B4'],[4,4,'C5']],
  };
  const REFRAO = 'Lava uma mão, lava outra, com o Pombo Crazy!';
  const CHORUS = [
    [REFRAO, 'c1', 'C', 'G', 'chorus'],
    ['Palma com palma, bate, bate — lavar é easy!', 'c2', 'Am', 'F', 'chorus'],
    [REFRAO, 'c1', 'C', 'G', 'chorus'],
    ['Ele tá de olho, não pisca não — Pombo Crazy!', 'c4', 'F', 'G', 'chorus'],
  ];
  const LINES = [
    ['', '', 'C', 'C', 'intro'],
    ['Entrou no banheiro ligeiro, ligeiro,', 'va', 'C', 'G', 'verse'],
    ['fez xixi, deu descarga, que maneiro!', 'vb', 'Am', 'F', 'verse'],
    ['Mas quando vai saindo de fininho...', 'va', 'C', 'G', 'verse'],
    ['tem um Pombo Crazy no caminho!', 'vd', 'F', 'G', 'verse'],
    ...CHORUS,
    ['Abre a torneira, pega o sabão,', 'va', 'C', 'G', 'verse'],
    ['esfrega a palma, esfrega o dedão,', 'vb', 'Am', 'F', 'verse'],
    ['entre os dedinhos, unha também...', 'va', 'C', 'G', 'verse'],
    ['tchau, bichinho! Não sobra ninguém!', 'vd', 'F', 'G', 'verse'],
    ...CHORUS,
    [REFRAO, 'c1', 'C', 'G', 'chorus'],
    ['E você... já lavou as mãos?', 'end', 'F', 'C', 'break'],
  ].map((l, i) => ({ text: l[0], pat: l[1], chords: [l[2], l[3]], sec: l[4], start: i * LINE }));

  // palmas: "pá" on 2 & 4; in the chorus, double "pá-pá" — the second one is a high-five
  const CLAP_BEATS = { intro: [1, 3, 5, 7], break: [1, 3, 5, 7], verse: [1, 3, 5, 7], chorus: [1, 3, 3.5, 5, 7, 7.5] };
  const STOMP_BEATS = [0, .5, 2, 2.5, 4, 4.5, 6, 6.5];   // boom-boom-PÁ
  const CLAPS = [];
  LINES.forEach((line) => CLAP_BEATS[line.sec].forEach((b) =>
    CLAPS.push({ t: line.start + b * BEAT, kind: line.sec === 'chorus' && b % 1 ? 'hi5' : 'own', sec: line.sec })));
  function nearestClap(t) {
    let best = null, d = Infinity;
    for (const c of CLAPS) { const k = Math.abs(t - c.t); if (k < d) { d = k; best = c; } else if (c.t > t) break; }
    return best;

    let last = null;

  const POWER = { C: 48, G: 43, Am: 45, F: 41 };   // power chord roots (guitar range)
  const midi = (n) => {
    const m = n.match(/^([A-G])(#?)(\d)$/);
    return { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }[m[1]] + (m[2] ? 1 : 0) + 12 * (+m[3] + 1);

  // ---------------------------------------------------------------- audio
  let ctx = null, master, music, sfx, voice, noiseBuf, t0 = 0, perf0 = 0, playing = false;
  let voiceOn = true;

  function initAudio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (master) master.disconnect();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.15;
    comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp);
    music = ctx.createGain(); music.gain.value = 1; music.connect(master);
    sfx = ctx.createGain(); sfx.gain.value = 1; sfx.connect(master);
    voice = ctx.createGain(); voice.gain.value = voiceOn ? 1.4 : 0; voice.connect(master);
  }

  function osc(type, freq, start, dur, gain, dest, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, start);
    if (opts.to) o.frequency.exponentialRampToValueAtTime(opts.to, start + (opts.glide || dur));
    const a = opts.attack ?? 0.01, r = opts.release ?? 0.08;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(gain, start + a);
    g.gain.setValueAtTime(gain, Math.max(start + a, start + dur - r));
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(dest);
    o.start(start); o.stop(start + dur + 0.05);
    return o;
  }
  function noise(start, dur, gain, dest, type = 'highpass', freq = 1000, opts = {}) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, start);
    if (opts.to) f.frequency.exponentialRampToValueAtTime(opts.to, start + dur);
    if (opts.q) f.Q.value = opts.q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(gain, start + (opts.attack || 0.005));
    g.gain.setValueAtTime(gain, start + Math.max(opts.attack || 0.005, dur * (opts.hold || 0)));
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    s.connect(f); f.connect(g); g.connect(dest);
    s.start(start); s.stop(start + dur + 0.05);
  }

  // drums & hands
  const kick = (st, g = 0.95) => { osc('sine', 170, st, 0.24, g, music, { to: 42, glide: 0.16, attack: 0.002, release: 0.12 }); noise(st, 0.02, 0.25, music, 'lowpass', 3000); };
  const snare = (st, g = 0.32) => { noise(st, 0.2, g, music, 'highpass', 1200); osc('triangle', 200, st, 0.1, 0.3, music, { to: 150, attack: 0.002 }); };
  const hat = (st, g = 0.05, open = false) => noise(st, open ? 0.2 : 0.035, g, music, 'highpass', 8000);
  const crash = (st) => noise(st, 1.8, 0.16, music, 'highpass', 4500, { hold: 0.02 });
  const stomp = (st) => { osc('sine', 120, st, 0.32, 1, music, { to: 38, glide: 0.25, attack: 0.003, release: 0.15 }); noise(st, 0.12, 0.45, music, 'lowpass', 280); };
  function clap(st, g = 0.9) {
    // a real-sounding clap is a few tiny noise slaps followed by a short room tail
    for (let i = 0; i < 3; i++) noise(st + i * 0.011, 0.024, g, music, 'bandpass', 1300 + i * 120, { q: 1.3 });
    noise(st + 0.034, 0.22, g * 0.65, music, 'bandpass', 1100, { q: 1 });
  }
  function distCurve(k) {
    const n = 2048, c = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; c[i] = (3 + k) * x * 20 * Math.PI / 180 / (Math.PI + k * Math.abs(x)); }
    return c;
  }

  function scheduleSong(T) {
    const lead = ctx.createBiquadFilter(); lead.type = 'lowpass'; lead.frequency.value = 2600; lead.connect(music);
    // distorted rhythm guitar: saws → fuzz → cabinet
    const gtrIn = ctx.createGain();
    const drive = ctx.createWaveShaper(); drive.curve = distCurve(70); drive.oversample = '4x';
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 90;
    const cab = ctx.createBiquadFilter(); cab.type = 'lowpass'; cab.frequency.value = 3000; cab.Q.value = 0.9;
    const gtr = ctx.createGain(); gtr.gain.value = 0.1;
    gtrIn.connect(drive); drive.connect(hp); hp.connect(cab); cab.connect(gtr); gtr.connect(music);
    const bass = ctx.createBiquadFilter(); bass.type = 'lowpass'; bass.frequency.value = 600; bass.connect(music);

    const power = (root, st, dur, g, muted) =>
      [0, 7, 12].forEach((iv) => osc('sawtooth', hz(root + iv), st, dur, g, gtrIn, { attack: 0.004, release: muted ? 0.03 : 0.25 }));

    LINES.forEach((line, li) => {
      const L = T + line.start, sec = line.sec;
      const prev = LINES[li - 1], next = LINES[li + 1];
      // lead "voice"
      (P[line.pat] || []).forEach(([b, d, n]) => {
        const st = L + b * BEAT, du = d * BEAT * 0.9, m = midi(n);
        osc('square', hz(m), st, du, 0.075, lead);
        osc('sawtooth', hz(m) * 1.004, st, du, 0.03, lead);
      });
      if (prev && prev.sec !== sec && sec !== 'break') crash(L);
      // boom-boom-PÁ in the intro and the final stare
      if (sec === 'intro' || sec === 'break') STOMP_BEATS.forEach((b) => stomp(L + b * BEAT));

      line.chords.forEach((c, bi) => {
        const B = L + bi * 4 * BEAT, root = POWER[c];
        if (sec === 'intro') {
          if (bi === 1) for (let e = 0; e < 8; e++) power(root, B + e * BEAT / 2, 0.14, 0.08 + e * 0.03, true);
          return;
        }
        if (sec === 'break') { power(root, B, 4 * BEAT * 0.95, 0.25, false); return; }
        const chorus = sec === 'chorus';
        for (let e = 0; e < 8; e++) {
          const st = B + e * BEAT / 2;

          osc('sawtooth', hz(root - 12), st, BEAT / 2 * 0.85, 0.22, bass, { attack: 0.004 });

        }

        [1, 3].forEach((b) => snare(B + b * BEAT));
      });

      if (sec === 'intro') for (let i = 0; i < 8; i++) snare(L + 6 * BEAT + i * BEAT / 4, 0.08 + i * 0.03);
    });

  function scheduleSfx(T) {

    osc('sawtooth', 180, T + 4.0, 0.5, 0.03, sfx, { to: 320 });

    }
    else if (t < 26.6) { walkTo(22.6, 26.4, 240, 1030, t); st.face = 'worried'; st.speed = 11; if (t < 22.6) st.dir = 1; }
    else if (t < 36) { st.x = 1030; st.pose = 'show'; st.face = t > 31 ? 'worried' : 'shock'; }
    else if (t < 51.5) { st.x = 1030; st.pose = 'wash'; st.face = t > 40 ? 'happy' : 'smile'; }
    else if (t < 68) {
      st.x = 1030; st.pose = 'clapgame'; st.face = 'big';
      st.hop = Math.abs(Math.sin((t - 52) * Math.PI / BEAT / 2)) * 10;
      if (between(t, 59.6, 62.3)) { st.pose = 'show'; st.face = 'shock'; st.hop = 0; }
    }
    else if (t < 72) {
      walkTo(68.4, 71.4, 1030, 150, t); st.face = 'big'; st.pose = st.walk ? 'wave' : 'idle';
      if (t < 68.4) st.dir = 1;
      st.visible = 1 - seg(t, 71.4, 71.8);
    }
    else st.visible = 0;
    return st;
  }

  function handsFor(st, t) {
    const sh = { x: 4, y: -200 };
    const ph = t * st.speed;
    switch (st.pose) {
      case 'walk': return { sh, b: { x: -Math.sin(ph) * 30, y: -124 }, f: { x: Math.sin(ph) * 30, y: -124 } };
      case 'shock': return { sh, shB: { x: -30, y: -205 }, shF: { x: 36, y: -205 }, b: { x: -48, y: -275 + Math.sin(t * 30) * 3 }, f: { x: 72, y: -275 + Math.cos(t * 30) * 3 } };
      case 'show': return { sh, b: { x: 66, y: -206 + Math.sin(t * 6) * 4 }, f: { x: 100, y: -214 + Math.cos(t * 6) * 4 } };
      case 'wash': {
        const r = t > 38 && t < 50.5 ? 1 : 0.2;
        return { sh, b: { x: 84 + Math.sin(t * 14) * 8 * r, y: -228 + Math.cos(t * 14) * 5 * r }, f: { x: 96 - Math.sin(t * 14) * 8 * r, y: -236 - Math.cos(t * 14) * 5 * r } };
      }
      case 'clapgame': {
        // hands open between claps, meet in front on "pá", reach the Pombo's wing on the high-five
        const c = nearestClap(t);
        const w = c ? smooth(clamp(1 - Math.abs(t - c.t) / 0.2)) : 0;
        const rest = { b: { x: 34, y: -262 + Math.sin(t * 8) * 4 }, f: { x: 116, y: -262 - Math.sin(t * 8) * 4 } };
        const hit = c && c.kind === 'hi5' ? { b: { x: 108, y: -300 }, f: { x: 122, y: -314 } } : { b: { x: 70, y: -238 }, f: { x: 82, y: -238 } };
        const mix = (a, b) => ({ x: lerp(a.x, b.x, w), y: lerp(a.y, b.y, w) });
        return { sh, b: mix(rest.b, hit.b), f: mix(rest.f, hit.f) };
      }
      case 'celebrate': return { sh, shB: { x: -30, y: -205 }, shF: { x: 36, y: -205 }, b: { x: -50 + Math.sin(t * 9) * 8, y: -320 }, f: { x: 66 - Math.sin(t * 9) * 8, y: -322 } };
      case 'wave': return { sh, shF: { x: 30, y: -205 }, b: { x: -Math.sin(ph) * 25, y: -124 }, f: { x: 74 + Math.sin(t * 14) * 12, y: -318 } };
      default: return { sh, b: { x: -14, y: -124 }, f: { x: 18, y: -124 } };
    }
  }

  function setFace(kind) {
    const on = (e, v) => e.setAttribute('opacity', v ? 1 : 0);
    on(face.eyesNormal, kind === 'smile' || kind === 'sneaky' || kind === 'worried');
    on(face.eyesShock, kind === 'shock');
    on(face.eyesHappy, kind === 'happy' || kind === 'big');
    on(face.mouthSmile, kind === 'smile' || kind === 'happy' || kind === 'sneaky');
    on(face.mouthO, kind === 'shock');
    on(face.mouthBig, kind === 'big');
    on(face.mouthWorried, kind === 'worried');
  }

  function clapPulseAny(t) {
    const c = lastClap(t);
    return c ? Math.exp(-(t - c.t) * 12) : 0;
  }

  // ---------------------------------------------------------------- render
  function render(t) {
    const cam = cameraAt(t);
    camera.setAttribute('transform', `translate(800,450) scale(${cam.s}) translate(${-cam.fx},${-cam.fy})`);
    const stare = clamp((cam.s - 1.8) / 1.0);
    vig.setAttribute('opacity', 0.15 + stare * 0.75);

    // doors
    const exitOpen = Math.max(fade(t, 4.0, 5.6, 0.4), fade(t, 71.0, 72.6, 0.4));
    exitDoor.setAttribute('transform', `translate(40,0) scale(${1 - 0.82 * exitOpen},1) translate(-40,0)`);
    let stallOpen = Math.max(fade(t, 8.0, 9.0, 0.35), fade(t, 12.0, 12.9, 0.35));
    const shake = between(t, 11.0, 11.9) ? Math.sin(t * 80) * 4 : 0;
    stallDoor.setAttribute('transform', `translate(${380 + shake},0) scale(${1 - 0.8 * stallOpen},1) translate(-380,0)`);
    const fl = fade(t, 10.9, 12.2, 0.2);
    flushText.setAttribute('opacity', fl);
    flushText.setAttribute('transform', `translate(495,200) scale(${0.6 + 0.5 * smooth(seg(t, 10.9, 11.3))}) rotate(${Math.sin(t * 20) * 4}) translate(-495,-200)`);

    // kid
    const st = kidState(t);
    const anger = angerAt(t);
    const scared = anger > 0.3 && t < 72 && st.visible > 0.5;
    if (scared) { st.face = 'shock'; st.x += Math.sin(t * 55) * 3.5; }
    const bob = st.walk ? Math.abs(Math.sin(t * st.speed)) * 6 : 0;
    kid.setAttribute('transform', `translate(${st.x},${FLOOR - st.hop - bob}) scale(${st.dir * KID_SCALE},${KID_SCALE})`);
    kid.setAttribute('opacity', st.visible);
    const swing = st.walk ? Math.sin(t * st.speed) * 26 : 0;
    legBack.setAttribute('transform', `rotate(${-swing} 4 -110)`);
    legFront.setAttribute('transform', `rotate(${swing} -4 -110)`);
    const H = handsFor(st, t);
    for (const [arm, hand, p, sh] of [[armBack, handBack, H.b, H.shB || H.sh], [armFront, handFront, H.f, H.shF || H.sh]]) {
      arm.setAttribute('x1', sh.x); arm.setAttribute('y1', sh.y);
      arm.setAttribute('x2', p.x); arm.setAttribute('y2', p.y);
      hand.setAttribute('cx', p.x); hand.setAttribute('cy', p.y);
    }
    setFace(st.face);
    sweat.setAttribute('opacity', (st.face === 'shock' || st.face === 'worried') ? 0.6 + 0.4 * Math.sin(t * 10) : 0);
    sweat.setAttribute('transform', scared ? `translate(0,${(t * 60) % 14})` : '');
    $('kidShadow').setAttribute('opacity', 0.2 * (1 - clamp(st.hop / 80)));

    // germs
    const germVisible = t > 26.6 && t < 52;
    germs.forEach((g, i) => {
      const hp = g.hand === 'front' ? H.f : H.b;
      const popK = seg(t, g.pop, g.pop + 0.25);
      const wig = Math.sin(t * 9 + i) * 3;
      const s = germVisible ? (t < g.pop ? 1 + 0.12 * Math.sin(t * 12 + i) : 1 + popK * 1.2) : 0;
      g.grp.setAttribute('transform', `translate(${hp.x + g.dx + wig},${hp.y + g.dy}) scale(${s}) rotate(${wig * 6})`);
      g.grp.setAttribute('opacity', germVisible ? 1 - popK : 0);
    });

    // foam on hands while washing
    const foamK = t > 38 && t < 51 ? Math.min(seg(t, 37.9, 38.6), 1 - seg(t, 49.8, 51)) : 0;
    handFoam.setAttribute('opacity', foamK);
    const mid = { x: (H.b.x + H.f.x) / 2, y: (H.b.y + H.f.y) / 2 };
    foamBlobs.forEach((f, i) => {
      const a = f.a + t * 2;
      f.e.setAttribute('cx', mid.x + Math.cos(a) * f.d);
      f.e.setAttribute('cy', mid.y + Math.sin(a) * f.d * 0.6);
    });

    // sparkles on clean hands
    const spk = between(t, 51.6, 68) ? fade(t, 51.6, 68, 0.4) : 0;
    sparklesG.setAttribute('opacity', spk);
    sparkles.forEach((s, i) => {
      const hp = i % 2 ? H.f : H.b;
      const a = s.a + t * 3;
      const sc = 0.6 + 0.5 * Math.abs(Math.sin(t * 6 + i));
      s.e.setAttribute('transform', `translate(${hp.x + Math.cos(a) * 26},${hp.y + Math.sin(a) * 26}) scale(${sc})`);
    });

    // water & foam drop
    water.setAttribute('opacity', between(t, 36, 51.2) ? 0.85 * fade(t, 36, 51.2, 0.2) : 0);
    water.setAttribute('height', 70 + Math.sin(t * 30) * 2);
    const fd = seg(t, 36.9, 37.9);
    if (between(t, 36.8, 38.1)) {
      const sx = POMBO.x - 128, sy = POMBO.y - 236;
      const hx = st.x + mid.x * KID_SCALE * st.dir, hy = FLOOR + mid.y * KID_SCALE;
      const x = lerp(sx, hx, fd), y = lerp(sy, hy, fd) - Math.sin(fd * Math.PI) * 60;
      foamDrop.setAttribute('transform', `translate(${x},${y}) scale(${0.4 + fd * 0.8})`);
      foamDrop.setAttribute('opacity', 1);
    } else foamDrop.setAttribute('opacity', 0);

    // soap bubbles (world space)
    const bubbleOn = between(t, 38, 68);
    bubbles.forEach((b, i) => {
      if (!bubbleOn) { b.e.setAttribute('opacity', 0); return; }
      const life = 3 + b.seed * 2;
      const local = ((t - 38) + b.seed * life * 3) % life;
      const k = local / life;
      const ox = st.x + mid.x * KID_SCALE, oy = FLOOR + mid.y * KID_SCALE;
      const spread = t > 52 ? 700 : 160;
      const x = ox + (b.seed - 0.5) * spread * k * 2 + Math.sin(t * 2 + i) * 18;
      const y = oy - k * (t > 52 ? 650 : 380);
      b.e.setAttribute('cx', x); b.e.setAttribute('cy', y);
      b.e.setAttribute('r', 6 + b.seed * 16 + k * 6);
      b.e.setAttribute('opacity', Math.sin(k * Math.PI) * fade(t, 38, 68, 0.6));
    });

    // pombo
    const beatPh = (t % BEAT) / BEAT;
    let bounce = 0, squash = 1;
    if (t > 52 && t < 72) { bounce = Math.abs(Math.sin(beatPh * Math.PI)) * 14; squash = 1 - Math.abs(Math.sin(beatPh * Math.PI)) * 0.03; }
    if (between(t, 36.6, 37.1)) squash = 1 - Math.sin(seg(t, 36.6, 37.1) * Math.PI) * 0.12; // pump!
    const alertK = fade(t, 18.4, 19.4, 0.1);
    if (alertK > 0) bounce = Math.max(bounce, alertK * 22);
    // every clap gives the Pombo a little jolt
    const lc = lastClap(t);
    const clapPulse = lc && t > 4 ? Math.exp(-(t - lc.t) * 14) : 0;
    if (between(t, 20, 52)) squash = Math.min(squash, 1 - 0.05 * clapPulse);
    const jit = anger * Math.sin(t * 70) * 2.5;
    pombo.setAttribute('transform', `translate(${POMBO.x + jit},${POMBO.y - bounce})`);
    angerMark.setAttribute('opacity', anger);
    angerMark.setAttribute('transform', `translate(70,-345) scale(${0.8 + 0.25 * Math.abs(Math.sin(t * 8))}) translate(-70,345)`);

    // wing: high-fives in the clap game, waves goodbye in the outro
    const nc = nearestClap(t);
    const nw = nc ? smooth(clamp(1 - Math.abs(t - nc.t) / 0.2)) : 0;
    let wingA = -70;
    if (st.pose === 'clapgame') wingA = nc.kind === 'hi5' ? lerp(-70, 22, nw) : -70 + 12 * nw;
    else if (between(t, 20, 52) && nc) wingA = -70 + (nc.kind === 'hi5' ? 45 : 14) * nw;
    else if (between(t, 68, 72)) wingA = 5 + Math.sin(t * 14) * 28;
    wing.setAttribute('transform', `translate(-58,-92) rotate(${wingA})`);
    pomboHead.setAttribute('transform', `translate(0,-140) scale(1,${squash}) translate(0,140)`);
    alertEl.setAttribute('opacity', alertK);
    alertEl.setAttribute('transform', `translate(20,-400) scale(${0.6 + 0.5 * alertK}) translate(-20,400)`);

    const happy = fade(t, 52, 59.4, 0.25) > 0.5 || fade(t, 62.2, 68, 0.2) > 0.5;
    eyeOpen.setAttribute('opacity', happy ? 0 : 1);
    eyeHappy.setAttribute('opacity', happy ? 1 : 0);

    // laser state
    let L = LASERS.find((l) => between(t, l.charge, l.b + 0.05));
    let laserTarget = null, charging = 0, firing = 0;
    if (L) {
      charging = t < L.a ? seg(t, L.charge, L.a) : 1;
      firing = t >= L.a ? 1 : 0;
      if (L.kind === 'floor') laserTarget = { x: st.x + 75, y: FLOOR - 4 };
      else {
        // scanner sweeps over the dirty hands only
        const k = (t - L.charge) * 6;
        laserTarget = { x: st.x + (80 + Math.sin(k) * 30) * KID_SCALE * st.dir, y: FLOOR - 255 + Math.sin(k * 1.7) * 18 };
      }
    }
    const finalCharge = t >= FINAL_ZAP.charge ? seg(t, FINAL_ZAP.charge, FINAL_ZAP.a) : 0;
    charging = Math.max(charging, finalCharge);

    // where does the eye look?
    let tx, ty;
    const lookViewer = t > 72.2;
    if (lookViewer || st.visible < 0.2) {
      tx = EYE.x + Math.sin(t * 0.9) * (t > 72.2 ? 0 : 60); ty = EYE.y + (t > 72.2 ? 0 : 20);
      if (t < 4.3) { tx = EYE.x + Math.sin(t * 1.4) * 400; ty = EYE.y + 40; }
      if (t > 8.6 && t < 12.2) { tx = 495; ty = 450; } // stares at the stall door
    } else { tx = st.x + 20 * st.dir; ty = FLOOR - 270 * KID_SCALE - st.hop; }
    if (laserTarget) { tx = laserTarget.x; ty = laserTarget.y; }
    let dx = tx - EYE.x, dy = ty - EYE.y;
    const len = Math.hypot(dx, dy) || 1;
    const maxOff = 22 * Math.min(1, len / 200);
    dx = dx / len * maxOff; dy = dy / len * maxOff;
    const crazy = stare > 0.1 || between(t, 26.6, 36);
    const tremble = crazy ? Math.sin(t * 60) * 0.9 : 0;
    let pr = stare > 0.1 ? lerp(7, 4.5, stare) : 7;
    if (anger > 0.5) pr = 8 + charging * 3;
    pupil.setAttribute('cx', dx + tremble); pupil.setAttribute('cy', dy);
    pupil.setAttribute('r', pr);
    pupil.setAttribute('fill', anger > 0.5 ? '#e00000' : '#111');
    eyeWhite.setAttribute('fill', `rgb(255,${Math.round(lerp(253, 168, anger))},${Math.round(lerp(251, 160, anger))})`);
    eyeVeins.setAttribute('opacity', anger);
    angryLid.setAttribute('opacity', anger);
    pupilGlow.setAttribute('cx', dx); pupilGlow.setAttribute('cy', dy);
    pupilGlow.setAttribute('r', 12 + charging * 22 + firing * 6);
    pupilGlow.setAttribute('opacity', anger * (0.45 + 0.35 * Math.abs(Math.sin(t * 18))) + charging * 0.3);
    pupilShine.setAttribute('cx', dx - 2 + tremble); pupilShine.setAttribute('cy', dy - 3);
    let eyeScale = 1;
    if (between(t, 20, 36) || between(t, 52, 68)) eyeScale = 1 + 0.08 * Math.pow(1 - beatPh, 3);
    if (stare > 0.1) eyeScale += 0.1 * stare;
    eyeGroup.setAttribute('transform', `translate(12,-226) scale(${eyeScale})`);

    if (L && firing) {
      const sx = POMBO.x + jit + 12 + dx * eyeScale, sy = POMBO.y - bounce - 226 + dy * eyeScale;
      const grow = smooth(seg(t, L.a, L.a + 0.12));
      const ex = lerp(sx, laserTarget.x, grow), ey = lerp(sy, laserTarget.y, grow);
      laserLines.forEach((ln) => { ln.setAttribute('x1', sx); ln.setAttribute('y1', sy); ln.setAttribute('x2', ex); ln.setAttribute('y2', ey); });
      laserLines[1].setAttribute('stroke-width', 9 + Math.sin(t * 90) * 3);
      laserHit.setAttribute('cx', ex); laserHit.setAttribute('cy', ey);
      laserHit.setAttribute('r', 12 + Math.abs(Math.sin(t * 40)) * 10);
      laser.setAttribute('opacity', 1 - seg(t, L.b - 0.1, L.b));
    } else laser.setAttribute('opacity', 0);

    // floor zap: scorch mark, smoke and a "ZAP!"
    const F = LASERS[0];
    const zx = 240 + 75, zy = FLOOR - 4;
    scorch.setAttribute('cx', zx); scorch.setAttribute('cy', zy + 2);
    scorch.setAttribute('opacity', t > F.a + 0.3 ? 0.7 * (1 - seg(t, 24, 26)) : 0);
    smokes.forEach((sm, i) => {
      const k = (t - F.a - 0.3 - sm.seed * 0.8) / 1.6;
      if (k < 0 || k > 1) { sm.e.setAttribute('opacity', 0); return; }
      sm.e.setAttribute('cx', zx + Math.sin(k * 6 + i) * 18 + (sm.seed - 0.5) * 30);
      sm.e.setAttribute('cy', zy - k * 160);
      sm.e.setAttribute('r', 10 + k * 26);
      sm.e.setAttribute('opacity', 0.55 * Math.sin(k * Math.PI));
    });
    const zk = fade(t, 21.8, 23.3, 0.15);
    zapText.setAttribute('opacity', zk);
    zapText.setAttribute('transform', `translate(${zx + 110},${zy - 110}) rotate(-12) scale(${0.7 + 0.4 * smooth(seg(t, 21.8, 22.1))})`);

    // final zap at the viewer
    flash.setAttribute('opacity', between(t, FINAL_ZAP.a, FINAL_ZAP.b + 0.4) ? 0.6 * (1 - seg(t, FINAL_ZAP.a, FINAL_ZAP.b + 0.4)) : 0);

    // speech bubbles
    const pAnchor = toScreen(cam, POMBO.x - 80, POMBO.y - 300 - bounce);
    let pText = '', pOp = 0;
    if (between(t, 19.1, 23)) { pText = 'Já lavou as mãos!?'; pOp = fade(t, 19.1, 23, 0.25); }
    else if (between(t, 28, 31.4)) { pText = 'Já lavou as mãos!?'; pOp = fade(t, 28, 31.4, 0.25); }
    else if (between(t, 52.9, 57.5)) { pText = 'Muito bem! Mãos limpinhas! ✨'; pOp = fade(t, 52.9, 57.5, 0.25); }
    else if (between(t, 60, 62.2)) { pText = 'Já lavou as mãos!?'; pOp = fade(t, 60, 62.2, 0.2); }
    else if (between(t, 72.6, 77)) { pText = 'E VOCÊ... já lavou as mãos!?'; pOp = fade(t, 72.6, 77, 0.25); }
    pomboBubble.set(pText, pAnchor.x, pAnchor.y, pOp, 'left');

    const kAnchor = toScreen(cam, st.x + 20 * st.dir, FLOOR - 340 * KID_SCALE - st.hop);
    let kText = '', kOp = 0;
    if (between(t, 21.4, 22.6)) { kText = 'Eita!! 😱'; kOp = fade(t, 21.4, 22.6, 0.15); }
    else if (between(t, 31.6, 34.6)) { kText = 'Ainda não... 😅'; kOp = fade(t, 31.6, 34.6, 0.2); }
    else if (between(t, 62.2, 64.6)) { kText = 'JÁ!! 🙌'; kOp = fade(t, 62.2, 64.6, 0.2); }
    kidBubble.set(kText, kAnchor.x, kAnchor.y, kOp * st.visible, 'right');

    // "PÁ!" bursts where the hands meet
    bursts.forEach((b) => b.g.setAttribute('opacity', 0));
    if (st.pose === 'clapgame' && lc && t - lc.t < 0.22) {
      const b = bursts[CLAPS.indexOf(lc) % 2];
      const k = (t - lc.t) / 0.22;
      const hi5 = lc.kind === 'hi5';
      const x = hi5 ? 1170 : st.x + 76 * KID_SCALE, y = hi5 ? 492 - bounce : FLOOR - 238 * KID_SCALE - st.hop;
      b.g.setAttribute('transform', `translate(${x},${y}) scale(${(hi5 ? 0.9 : 0.6) + k * 0.6})`);
      b.g.setAttribute('opacity', 1 - k);
      b.txt.setAttribute('opacity', hi5 ? 1 : 0);
    }

    // confetti in the second chorus
    const confOn = between(t, 52, 68.5);
    confetti.forEach((c) => {
      if (!confOn) { c.e.setAttribute('opacity', 0); return; }
      const y = ((t - 52) * c.sp + c.ph * 90) % 1000 - 60;
      const x = c.x + Math.sin(t * 2 + c.ph) * 30;
      c.e.setAttribute('transform', `translate(${x},${y}) rotate(${c.rot + t * 200})`);
      c.e.setAttribute('opacity', fade(t, 52, 68.5, 0.5) * 0.9);
    });

    // title card at the start
    const tc = fade(t, 0.2, 3.8, 0.5);
    titleCard.style.opacity = tc;
    titleCard.style.transform = `scale(${0.9 + 0.1 * tc + 0.06 * clapPulseAny(t)})`;

    // lyrics (karaoke)
    const li = Math.floor(t / LINE);
    const line = LINES[li];
    if (line && line.text) {
      if (lyBase.textContent !== line.text) { lyBase.textContent = line.text; lyFill.textContent = line.text; }
      lyFill.style.width = (clamp((t - line.start) / (LINE * 0.85)) * 100) + '%';
      lyrics.classList.add('on');
      const clappy = line.sec !== 'verse';
      const icon = clappy ? '👏' : '♪';
      if (lyIconL.textContent !== icon) { lyIconL.textContent = icon; lyIconR.textContent = clappy ? '👏' : ''; }
      const pop = `scale(${1 + 0.6 * clapPulseAny(t)}) rotate(${clapPulseAny(t) * 18}deg)`;
      lyIconL.style.transform = pop; lyIconR.style.transform = pop;
    } else lyrics.classList.remove('on');
  }

  // ---------------------------------------------------------------- loop
  const now = () => (ctx ? ctx.currentTime - t0 : (performance.now() - perf0) / 1000);
  function frame() {
    if (!playing) return;
    const t = now();
    render(Math.max(0, t));
    if (t >= DURATION + 1.5) { stop(); return; }
    requestAnimationFrame(frame);
  }
  let voiceBufs = null;
  async function start() {
    try {
      initAudio();
      if (ctx) {
        if (ctx.state === 'suspended') ctx.resume();
        if (!voiceBufs) { try { voiceBufs = await loadVoices(ctx); } catch (e) { voiceBufs = {}; } }
        t0 = ctx.currentTime + 0.15;
        scheduleSong(t0);
        scheduleSfx(t0);
        scheduleVoices(t0, voiceBufs);
      }
    } catch (e) { ctx = null; }
    perf0 = performance.now() + 150;
    playing = true;
    $('startOverlay').classList.add('hidden');
    $('endOverlay').classList.add('hidden');
    $('voiceBtn').style.display = 'block';
    requestAnimationFrame(frame);
  }
  function stop() {
    playing = false;
    $('endOverlay').classList.remove('hidden');
    lyrics.classList.remove('on');
  }

  $('playBtn').addEventListener('click', start);
  $('replayBtn').addEventListener('click', () => {
    if (master) { master.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
    start();
  });
  $('voiceBtn').addEventListener('click', () => {
    voiceOn = !voiceOn;
    $('voiceBtn').textContent = voiceOn ? '🗣️ Voz: on' : '🔇 Voz: off';
    if (voice) voice.gain.setTargetAtTime(voiceOn ? 1.4 : 0, ctx.currentTime, 0.02);
  });

  // static preview behind the start screen; ?t=SECONDS jumps to a frame (handy for screenshots)
  const q = new URLSearchParams(location.search).get('t');
  if (q !== null) { $('startOverlay').classList.add('hidden'); render(+q); }
  else render(26.8);
})();
</script>
</body>
</html>
